[package]
name = "recon"
version = "0.7.0"
edition = "2024"
# Mirrors the floor in `vendor/tui-textarea-2/Cargo.toml`. Without it, an old
# toolchain fails inside the fork with an error that names a dependency, not
# recon. Keep the two in step.
rust-version = "1.88.0"
license = "MIT"
# Not published to crates.io. cargo-release reads this too: without it, it
# requires `description` and `repository` and stops with an error (#338).
publish = false

# `cargo machete` reports `tui-textarea-2` as unused. It is a false positive
# (#94), and the obvious "fix" is to delete a dependency the build needs.
#
# The vendored fork renames its library target — `[lib] name = "tui_textarea"`
# in `vendor/tui-textarea-2/Cargo.toml` — so `src/widgets/fileview.rs` imports
# `tui_textarea`, while machete searches for `tui_textarea_2`, the identifier
# derived from the *package* name, and finds nothing.
#
# Recorded here rather than in a comment on the dependency itself because this
# is the section the tool actually reads.
[package.metadata.cargo-machete]
ignored = ["tui-textarea-2"]

[workspace]
members = ["vendor/tui-textarea-2"]

# Pedantic is on, and CI's `-D warnings` turns every one of these into a build
# failure (#82). It lives here rather than as a `-W clippy::pedantic` flag on
# the CI step so that a local `cargo clippy` enforces exactly what CI does —
# a flag only CI passes is a gate you discover you have failed after pushing.
#
# `priority = -1` is what lets the individual `allow`s below override the group;
# without it Cargo rejects the table as ambiguous.
#
# Every exception is declined deliberately and says why. The count is zero, so
# anything new that appears here is genuinely new. Prefer fixing a site to
# adding a line — and if you do add one, add the reason with it.
#
# Note this is `[lints]`, not `[workspace.lints]`: it must not reach
# vendor/tui-textarea-2, which is kept verbatim from crates.io apart from the
# changes in its PATCH.md and is not held to this repo's lint standard.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Terminal geometry is `u16` (ratatui's `Rect`) and lengths are `usize`, so
# every width/column calculation crosses the two. The values are bounded by
# what a terminal can display, and 11 of the 14 sites are test code asserting
# against a const fixture string's `.len()`. `try_from` at each would be noise
# around an invariant the type system cannot express here. The sites where
# truncation would actually be a *bug* rather than an impossibility — the
# cursor row and scroll delta in `fileview.rs` — are written with `try_from`
# and saturation instead; see `cursor_screen_row`.
cast_possible_truncation = "allow"

# `handle_events` on `Explorer` and `FileView` take `Event`/`Input` by value
# because they consume it by matching, and the two `new(path: String)` ctors
# take an owned `String` because they store it. Borrowing would push a clone to
# every caller to save one here.
needless_pass_by_value = "allow"

# The arms are identical *today* by coincidence, not by meaning: the `Mode`
# arms in `document.rs` and the key arms in `fileview.rs` are each documented
# separately and change independently. Merging them would couple two decisions
# that only happen to agree.
match_same_arms = "allow"

# `FilterList::preferred_height`/`preferred_width` are methods for the same
# reason: every pane answers the layout with the same call shape, and taking
# `&self` is what makes them interchangeable at the call site.
unused_self = "allow"

# The keymap itself lives in one place: `keymap::DEFAULT`. `dispatch_event`
# walks the scope ladder in precedence order, and `perform` holds one arm per
# action, each carrying the body its key arm used to carry. Splitting either
# to satisfy a line count would scatter bodies that belong beside the action
# names they implement.
too_many_lines = "allow"

# `FileView`'s bools are independent view flags, not a state enum in disguise;
# they are set and read in unrelated places and no combination is invalid.
struct_excessive_bools = "allow"

# `args` and `argv` in `editor.rs` — the standard names for the whole vector
# and its tail. Renaming either to satisfy the lint would make both worse.
similar_names = "allow"

# recon ships a binary. `pub` on these 12 functions means "reachable from the
# crate's own tests", not "published API" — there is no downstream caller to
# write an `# Errors` contract for. Each returns `color_eyre::Result` and
# propagates an underlying io/regex/parse failure verbatim, so the section
# would restate the call below it. The prose docs that matter here describe
# what the function is *for*, and those are already written.
missing_errors_doc = "allow"

[dependencies]
ratatui = "0.30.2"
# `env` is what gives `#[arg(long, env = "RECON_FOO")]` CLI > env precedence
# without a hand-written merge. See docs/specs/2026-08-22-configuration-mechanism.md.
#
# `wrap_help` (#92) costs one dependency, `terminal_size`, and buys two things.
# Without it clap does not wrap help *at all*: `recon -h` emitted 169-column
# lines that a terminal then soft-wrapped mid-word. It is also what makes
# `term_width` do anything, and `term_width` is what lets the README's `## Usage`
# block be rendered at a fixed 80 columns and compared byte-for-byte against the
# real help — see `readme_usage_block_matches_the_real_help` in `config.rs`.
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
# `use-dev-tty` (#517): with stdin a pipe (`cmd | recon -`), the keys come
# from `/dev/tty`, which crossterm's default reader cannot poll on macOS:
# "Failed to initialize input reader". This reader polls it with `poll(2)`.
# `filedescriptor` is already in the build, so this adds no crate.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
# A SIGTERM must restore the terminal before recon exits (#382). Already in
# the build through crossterm, so this adds no crate. `flag::register` is the
# only part used: the handler stores a flag and the event loop acts on it.
signal-hook = "0.3"
env_logger = "0.11.11"
log = "0.4.33"
color-eyre = "0.6.5"
tui-textarea-2 = { version = "0.12.1", features = ["search"] }
regex = "1"
# Layout has to measure terminal columns, not chars: a CJK ideograph or an emoji
# occupies two columns, so a pane sized by `char` count comes out about half the
# width it needs and clips every row (#97). Costs no new crate — ratatui already
# pulls this in, and the four sites that measure text now agree with the renderer
# that draws it.
unicode-width = "0.2"
# Filetype icons and their colours (#512): about 600 name and extension
# rules from the vim-devicons table, in a dark and a light palette that
# match `Background`. Costs one more crate, `lazy_static`.
devicons = "0.6.13"
jiff = "0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
# Read-only on purpose: `default-features = false` drops the `display` feature,
# which is the serializer. `toml::to_string` therefore does not exist in this
# build, so the "recon never writes config.toml" decision cannot be broken by
# accident — it fails to compile. Restoring a write path means adding
# `toml_edit`, never re-enabling `display`; see the spec's "If a write path
# ever lands".
toml = { version = "1.1.4", default-features = false, features = [
    "parse",
    "serde",
    "std",
] }
# The one write path (#131): `S` appends a set to `filters.toml`. `toml_edit`
# rather than `toml`'s `display` feature — which stays off — because it
# preserves the comments, key order and whitespace of a hand-edited file,
# and the serializer would silently destroy every comment in a format chosen
# for supporting them. `config.toml` is never written; see the configuration
# spec's "If a write path ever lands".
toml_edit = "0.25.13"

# Syntax colouring for the file view (#122). `syntect` does the parsing and
# theming; `two-face` supplies bat's syntax and theme bundles in place of
# syntect's own, because syntect's default set has no Swift and no TOML and
# bat's has both, plus Kotlin, TypeScript, Dockerfile and ~150 others.
#
# `default-features = false` on syntect drops `default-syntaxes` and
# `default-themes`, which would only ship a second copy of what two-face
# already embeds. `plist-load` is what reads a user's own `.tmTheme` file
# (`[syntax] theme = "/path/to/Dracula.tmTheme"`); `regex-onig` is the
# Oniguruma engine bat's grammars are written against — the pure-Rust
# `regex-fancy` engine is slower and mis-parses some of them.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "dump-load",
    "plist-load",
    "regex-onig",
] }
two-face = "0.5"

# The advanced filter engine (#474, ADR 0008): lookaround, which the `regex`
# crate does not have. The same Oniguruma that `regex-onig` above already
# links for syntect, named here so recon can call it; `default-features =
# false` as syntect has it, so no second build of the C library.
onig = { version = "6.5", default-features = false }

# The image view (#458). `ratatui-image` finds the terminal's graphics
# protocol — kitty, iTerm2 or sixel — and falls back to half-blocks, so an
# image always shows. Its defaults are off: `chafa-dyn` links a C library
# through pkg-config, and `image-defaults` turns on every decoder `image`
# has, AVIF and OpenEXR among them.
#
# `image` is named here for the decoders the view shows. These are the
# formats a camera, a browser or a screenshot tool writes. Other formats
# come through `quicklook` on macOS.
ratatui-image = { version = "11.1.0", default-features = false, features = [
    "crossterm",
] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
infer = "0.22.0"
# The MIME type of a file that has no magic bytes, from its extension (#467).
# `infer` knows only magic numbers, so without this nearly every text file
# would have no type in the title and none a `mime =` row could match.
mime_guess = "2.0.5"
# A large JPEG for the image view, decoded at ½, ¼ or ⅛ scale (#484), so a
# scan too large to decode whole inside the memory limit still shows.
# `image`'s own JPEG decoder, `zune-jpeg`, has no scaled decode. Pure Rust;
# `default-features = false` leaves out `rayon`.
jpeg-decoder = { version = "0.3", default-features = false }

# Pattern generation in the filter editor (#319). Off by default, so a plain
# `cargo build` has no new dependency on any platform. `fm-rs` compiles a
# Swift layer over Apple's FoundationModels framework in its build script, so
# it is a dependency only on Apple-silicon macOS: `--features
# foundation-models` on Linux builds, and the editor there has no request
# line, as without the feature.
[features]
foundation-models = ["dep:fm-rs"]

# `-` in the TUI (#517): when the copy of stdin stops early, `/dev/null` is
# put over fd 0 so the writer gets SIGPIPE. `dup2_stdin` is the safe form of
# that `dup2`, which std has no way to say. Already in the build through
# crossterm, so this adds no crate.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "stdio"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fm-rs = { version = "0.3", optional = true }

# The build stamp (#337): `build.rs` writes the build time. Already a
# dependency of recon, so this adds no crate.
[build-dependencies]
jiff = "0.2.35"

# Dependencies are optimised in a debug build; recon itself is not, so it
# stays easy to step through (#458). Scaling a photo for the image view is
# a tight loop in `image`, and unoptimised it took 1.4 s for one picture
# where a release build takes 43 ms: a debug build was too slow to try the
# image view in. With this it takes 69 ms (85 ms for iTerm2, from 1.9 s). Cargo builds dependencies once, so only the first debug
# build is slower. `"*"` is every package that is not a workspace member,
# so `vendor/tui-textarea-2` is not changed.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
tui-textarea-2 = { path = "vendor/tui-textarea-2" }

[package]
name = "recon"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["vendor/tui-textarea-2"]

[dependencies]
ratatui = "0.30.2"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29"
env_logger = "0.11.11"
log = "0.4.33"
color-eyre = "0.6.5"
tui-textarea-2 = { version = "0.12.1", features = ["search"] }
regex = "1"
jiff = "0.2.35"

[patch.crates-io]
tui-textarea-2 = { path = "vendor/tui-textarea-2" }
